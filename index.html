<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f5">
  <title>Mahjong Ledger | Singapore Mahjong Money Tracker</title>
  <style>
    :root {

      --paper: #fff;
      --ink: #182a27;

      --red-pale: #fff0ef;
      --cream: #f9f7ee;
      --shadow: 0 7px 32px rgba(19, 55, 40, .045);

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.42; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    :focus-visible { outline: 3px solid #54ad91; outline-offset: 3px; }
    .shell { max-width: 1200px; padding: 25px 24px 80px; margin: 0 auto; }
    .sitebar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 29px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-icon { height: 45px; width: 45px; border: 2px solid #134c3c; background: #fff; color: #164c3b; display: grid; place-items: center; font-size: 24px; font-weight: 750; border-radius: 12px; box-shadow: 3px 3px 0 #c8e8d6; flex: none; }
    .brand-name { font-size: 21px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 4px; letter-spacing: .3px; }
    .nav { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 11px; padding: 10px 14px; min-height: 43px; font-size: 13px; font-weight: 700; transition: border .15s, background .15s, transform .15s; }
    .btn:hover:not(:disabled) { background: #f4faf6; border-color: #a7c8ba; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
    .btn.primary:hover:not(:disabled) { background: var(--green-dark); }
    .btn.secondary { background: var(--green-pale); color: var(--green-dark); border-color: #cce6d6; }
    .btn.danger { color: var(--red); }
    .btn.wide { width: 100%; }
    .btn.big { padding: 14px 17px; font-size: 15px; min-height: 52px; }
    .btn.small { min-height: 32px; border-radius: 9px; padding: 6px 10px; font-size: 12px; }
    .btn.link-btn { border: 0; background: transparent; padding-inline: 5px; color: var(--green); }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: 1.2px; }
    .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; margin-bottom: 19px; }
    h1,h2,h3,p { margin: 0; }
    h1 { font-size: clamp(24px, 3vw, 34px); letter-spacing: -1.2px; line-height: 1.22; margin-top: 4px; }
    h2 { font-size: 19px; letter-spacing: -.45px; }
    h3 { font-size: 15px; letter-spacing: -.15px; }
    .subtitle { color: var(--muted); margin-top: 8px; font-size: 13px; }
    .total-pill { border: 1px solid #cce6d6; background: #e9f6ed; border-radius: 12px; padding: 11px 15px; text-align: right; white-space: nowrap; }
    .total-pill .total-label { font-size: 11px; color: #476e5c; font-weight: 750; }
    .total-pill strong { font-size: 20px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
    .total-pill.error { border-color: #efb7bb; background: var(--red-pale); color: var(--red); }

    .player.east { border: 1.5px solid #68a990; background: linear-gradient(150deg, #eff9f2 0%, #fff 71%); }
    .player-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    .player-name { font-weight: 760; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .wind-tag { border-radius: 7px; padding: 4px 7px; background: #edf0ec; color: #63736d; font-size: 10px; font-weight: 800; white-space: nowrap; }

    .loss { color: var(--red); }

    .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-pad { padding: 22px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-head p { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #eef3ef; border-radius: 12px; padding: 4px; margin: 22px 0 20px; gap: 4px; }

    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #163e32; color: #fff; border-radius: 10px; padding: 11px 17px; z-index: 100; font-size: 13px; font-weight: 700; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px #183a3040; text-align: center; }

    .modal-head { padding: 22px 24px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .modal-body { padding: 10px 24px 24px; }

    .modal-close { background: transparent; border: 0; font-size: 25px; color: var(--muted); line-height: 1; padding: 0 3px; }
    .banker-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .banker-opt { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; border-radius: 11px; padding: 14px; border: 1px solid var(--line); background: #fff; text-align: left; min-height: 78px; }
    .banker-opt strong { font-size: 15px; }
    .banker-opt small { color: var(--muted); }
    .banker-opt.active { border: 2px solid var(--green); background: var(--green-pale); padding: 13px; }
    .modal-controls { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    .setup-shell { max-width: 850px; margin: 40px auto 0; }
    .setup-intro { text-align: center; margin-bottom: 24px; }
    .setup-intro h1 { margin: 10px auto; }
    .setup-intro p { color: var(--muted); font-size: 14px; }
    .setup-card { background: white; border: 1px solid var(--line); border-radius: 21px; padding: 27px; box-shadow: var(--shadow); }
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 17px; }
    .setup-field { display: flex; flex-direction: column; gap: 7px; }
    .setup-field label { font-size: 12px; font-weight: 800; }
    .seat-hint { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 7px; }
    .setup-bottom { background: #f1f7f2; border: 1px solid #d9e7dd; padding: 14px; border-radius: 12px; margin-top: 22px; color: #416654; font-size: 12px; line-height: 1.65; }
    .setup-start { margin-top: 20px; }

    .rules-table td,.rules-table th { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: left; }

      .shell { padding: 17px 13px 70px; }
      .sitebar { align-items: flex-start; margin-bottom: 24px; gap: 8px; }
      .brand-name { font-size: 18px; }

      .brand-icon { width: 39px; height: 39px; }
      .nav { gap: 4px; }

      .hero-row { align-items: center; }
      .hero-row h1 { font-size: 25px; }

<body>
<div id="app"></div>
<script>
'use strict';
(function () {
  const STORAGE_KEY = 'sg-mahjong-ledger.v1';
  const STARTING_CENTS = 3000;
  const BASE_CENTS = [0, 80, 160, 320, 640, 1280];
  const WINDS = ['East', 'South', 'West', 'North'];
  const WIND_CHARS = ['東', '南', '西', '北'];
  const defaultNames = ['Player 1', 'Player 2', 'Player 3', 'Player 4'];
  const root = document.getElementById('app');
  let session = loadSession();
  let ui = { tab: 'flower', modal: null, allHistory: false, toast: '', draft: { collector: 0, flower: 1, initial: false, winner: 0, tai: 3, method: 'self', discarder: 1, gangPlayer: 0 } };
  let toastTimeout = null;

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
  }
  function money(cents) { return '$' + (cents / 100).toFixed(2); }
  function signed(cents) { return (cents > 0 ? '+' : cents < 0 ? '-' : '') + money(Math.abs(cents)); }
  function safeName(index) { return escapeHTML(session.players[index]); }
  function name(index) { return session.players[index]; }
  function fromEast(east, flowerNo) { return (east + flowerNo - 1) % 4; }
  function windOfPlayer(east, player) { return (player - east + 4) % 4; }

  function flowerTransfers(east, collector, flower, initial) {
    const owner = fromEast(east, flower);
    const perPayer = initial ? 40 : 20;
    if (owner === collector) {
      return [0, 1, 2, 3].filter(p => p !== collector).map(from => ({ from, to: collector, cents: perPayer }));
    }
    return [{ from: owner, to: collector, cents: perPayer }];
  }
  function winningTransfers(winner, tai, method, discarder) {
    const amount = BASE_CENTS[tai];
    if (method === 'self') {
      return [0, 1, 2, 3].filter(p => p !== winner).map(from => ({ from, to: winner, cents: amount / 2 }));
    }
    return [{ from: discarder, to: winner, cents: amount }];
  }
  function addTransfers(balances, transfers) {
    transfers.forEach(t => { balances[t.from] -= t.cents; balances[t.to] += t.cents; });
  }
  function newHand(number, east) { return { number, east, flowers: [], gangs: [], events: [], outcome: null }; }
  function derive(s) {
    const balances = [STARTING_CENTS, STARTING_CENTS, STARTING_CENTS, STARTING_CENTS];
    const hands = [];
    let east = s.initialEast;
    let current = newHand(1, east);
    for (let ai = 0; ai < s.actions.length; ai++) {
      const action = s.actions[ai];
      if (action.type === 'setEast') {
        east = action.east;
        current.east = east;
        continue;
      }
      if (action.type === 'flower') {
        const transfers = flowerTransfers(east, action.collector, action.flower, action.initial);
        addTransfers(balances, transfers);
        const event = { type: 'flower', actionIndex: ai, collector: action.collector, flower: action.flower, initial: action.initial, transfers };
        current.events.push(event);
        current.flowers.push(action.flower);
        continue;
      }
      if (action.type === 'gang') {
        // A declared Gang affects East rotation ONLY if this hand ultimately draws.
        // No automatic Gang payment has been specified in these house rules.
        const event = { type: 'gang', actionIndex: ai, player: action.player, transfers: [] };
        current.events.push(event);
        current.gangs.push(action.player);
        continue;
      }
      if (action.type === 'win') {
        const transfers = winningTransfers(action.winner, action.tai, action.method, action.discarder);
        addTransfers(balances, transfers);
        const event = { type: 'win', actionIndex: ai, winner: action.winner, tai: action.tai, method: action.method, discarder: action.discarder, transfers };
        current.events.push(event);
        current.outcome = event;
        hands.push(current);
        if (action.winner !== east) east = (east + 1) % 4;
        current = newHand(current.number + 1, east);
        continue;
      }
      if (action.type === 'draw') {
        // Allow a Gang to be entered while marking a draw, without a separate tap.
        if (Number.isInteger(action.extraGang) && action.extraGang >= 0 && action.extraGang < 4) {
          current.gangs.push(action.extraGang);
          current.events.push({ type: 'gang', actionIndex: ai, player: action.extraGang, quickEntry: true, transfers: [] });
        }
        const nonEastGang = current.gangs.some(player => player !== east);
        const nextEast = nonEastGang ? (east + 1) % 4 : east;
        current.outcome = { type: 'draw', actionIndex: ai, nonEastGang, nextEast, transfers: [] };
        hands.push(current);
        east = nextEast;
        current = newHand(current.number + 1, east);
      }
    }
    hands.push(current);
    return { balances, hands, current, east, total: balances.reduce((a,b) => a+b, 0) };
  }
  function loadSession() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 1 || !Array.isArray(parsed.players) || parsed.players.length !== 4 || !parsed.players.every(x => typeof x === 'string') || !Number.isInteger(parsed.initialEast) || parsed.initialEast < 0 || parsed.initialEast > 3 || !Array.isArray(parsed.actions)) return null;
      return parsed;
    } catch (err) { return null; }
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); }

  function showToast(msg) {

    toastTimeout = setTimeout(() => { if (el.isConnected) el.remove(); ui.toast = ''; }, 2700);
  }

  function setupView() {

  function currentHandPanel(model) {

  function summaryTransfers(transfers) {

      return `${transfers.map(t=>safeName(t.from)).join(', ')} paid ${safeName(transfers[0].to)} ${money(transfers[0].cents)} each`;
    }

  function historyCard(h, isCurrent) {

        <div class="field"><label for="draw-extra-gang">Add a Gang you haven't recorded yet (optional)</label><select id="draw-extra-gang"><option value="">No additional Gang</option>${session.players.map((n,i)=>`<option value="${i}">${escapeHTML(n)}${i===model.east?' (East)':' (non-East)'}</option>`).join('')}</select><p class="note" style="margin-top:6px">Select the player who claimed four identical tiles. Gang has no payment under these rules.</p></div>
        <div id="draw-east-prediction" class="warning" role="status">${nonEastGang ? `Non-East Gang recorded. East passes from <b>${safeName(model.east)}</b> to <b>${safeName(nextEast)}</b> on the next hand.` : `No non-East Gang recorded. <b>${safeName(model.east)}</b> stays East on the next hand.`}</div>
        <div class="modal-controls"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="confirm-draw">Mark draw & start next hand</button></div></div>`;
        break;
      }
      case 'more':
        content=`<div class="modal-head"><div><div class="eyebrow">Session options</div><h2>Manage session</h2></div><button class="modal-close" data-action="close-modal" type="button" aria-label="Close">×</button></div><div class="modal-body"><p>Your session is stored locally in this browser. It is not shared with other devices.</p><div style="display:grid;gap:9px"><button class="btn wide" type="button" data-action="edit-names">Edit player names</button><button class="btn wide" type="button" data-action="export">Export payments to CSV</button><button class="btn wide danger" type="button" data-action="reset-confirm">Start a new session (reset all balances)</button></div></div>`;
        break;
      case 'names':
        content=`<div class="modal-head"><div><div class="eyebrow">Manage players</div><h2>Edit player names</h2></div><button class="modal-close" data-action="close-modal" type="button" aria-label="Close">×</button></div><div class="modal-body"><p>Name changes also update the names displayed in your past hand history. Seat order and money will not change.</p><div class="setup-grid">${session.players.map((n,i)=>`<div class="setup-field"><label for="edit-name-${i}">Seat ${i+1}</label><input class="text-input" id="edit-name-${i}" value="${escapeHTML(n)}" maxlength="28"></div>`).join('')}</div><div class="modal-controls"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="save-names">Save names</button></div></div>`;
        break;
      case 'reset':
        content=`<div class="modal-head"><div><div class="eyebrow">New session</div><h2>Reset the game?</h2></div><button class="modal-close" data-action="close-modal" type="button" aria-label="Close">×</button></div><div class="modal-body"><p>This clears every hand and payment in the current session and sets all four starting balances back to <b>$30.00</b>. This action cannot be undone. Export first if you want a copy.</p><div class="modal-controls"><button type="button" class="btn" data-action="close-modal">Keep current game</button><button type="button" class="btn danger" data-action="confirm-reset">Reset and start over</button></div></div>`;
        break;
    }
    return `<div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(ui.modal)} dialog">${content}</section></div>`;
  }
  function normalizeDraft(model) {
    const d = ui.draft;
    if (!Number.isInteger(d.collector) || d.collector < 0 || d.collector > 3) d.collector = 0;
    if (!Number.isInteger(d.winner) || d.winner < 0 || d.winner > 3) d.winner = 0;
    if (!Number.isInteger(d.gangPlayer) || d.gangPlayer < 0 || d.gangPlayer > 3) d.gangPlayer = 0;
    if (d.discarder===d.winner || !Number.isInteger(d.discarder) || d.discarder<0 || d.discarder>3) d.discarder = [0,1,2,3].find(i=>i!==d.winner);
    if (!Number.isInteger(d.flower) || d.flower<1 || d.flower>4) d.flower = 1;
    if (!Number.isInteger(d.tai) || d.tai<1 || d.tai>5) d.tai = 3;
    if (!['self','discard'].includes(d.method)) d.method='self';
  }
  function render() {
    root.innerHTML = session ? mainView() : setupView();
    if (ui.modal) {
      const model = session ? derive(session) : null;
      document.body.insertAdjacentHTML('beforeend', `<div id="modal-container">${modalView(model)}</div>`);
      const closeTarget = document.querySelector('#modal-container .modal-close');
      if (closeTarget) closeTarget.focus();
    }
    const previous = document.querySelectorAll('#modal-container:not(:last-of-type)');
    // An existing modal container is removed on each render by removeModal() below.
  }
  function removeModal() {
    document.querySelectorAll('#modal-container').forEach(e=>e.remove());
  }
  function repaint() { removeModal(); render(); }
  function validateNames(inputs) {
    const names = inputs.map(id => (document.getElementById(id)?.value || '').trim());
    if (names.some(n=>!n)) { showToast('Please give every player a name.'); return null; }
    return names;
  }
  function downloadCSV() {
    const m = derive(session);
    const rows = [
      ['Mahjong Ledger | Singapore Mahjong'],
      ['Session started',session.createdAt||''],
      ['Starting amount per player', '30.00'],
      [],
      ['Player', 'Final balance (AUD)', 'Net change (AUD)', 'Current wind', 'Seat'],
      ...session.players.map((n,i)=>[n,(m.balances[i]/100).toFixed(2),((m.balances[i]-STARTING_CENTS)/100).toFixed(2),WINDS[windOfPlayer(m.east,i)],i+1]),
      ['TOTAL',(m.total/100).toFixed(2),'0.00'],
      [],
      ['Hand', 'East banker', 'Event', 'Payer', 'Receiver', 'Amount (AUD)', 'Notes']
    ];
    for (const hand of m.hands) {
      for (const event of hand.events) {
        if (event.type === 'gang') rows.push([hand.number, name(hand.east), 'Gang', '', '', '0.00', `${name(event.player)} declared Gang; no payment`]);
        for (const transfer of event.transfers) {
          rows.push([hand.number, name(hand.east), event.type==='flower'?'Flower':'Win', name(transfer.from), name(transfer.to), (transfer.cents/100).toFixed(2), event.type==='flower'? `Pair #${event.flower}${event.initial?' / original initial tiles x2':''}` : `${event.tai} Tai / ${event.method==='self'?'self-draw':'discard'}`]);
        }
      }
      if (hand.outcome?.type === 'draw') rows.push([hand.number, name(hand.east), 'Draw', '', '', '0.00', hand.outcome.nonEastGang ? `Non-East Gang: banker advances to ${name(hand.outcome.nextEast)}` : 'No non-East Gang: banker stays']);
    }
    const csv = '\ufeff' + rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mahjong-ledger-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('CSV exported.');
  }
  function handleAction(action, button) {
    if (action==='close-modal') { ui.modal=null; repaint(); return; }
    if (action==='rules') { ui.modal='rules'; repaint(); return; }
    if (action==='start') {
      const names = validateNames([0,1,2,3].map(i=>'setup-player-'+i));
      if (!names) return;
      const east = Number(document.querySelector('input[name="setup-east"]:checked')?.value || 0);
      session = {version:1, createdAt:new Date().toISOString(), players:names, initialEast:east, actions:[]};
      ui = { tab:'flower', modal:null, allHistory:false, toast:'', draft:{collector:0,flower:1,initial:false,winner:0,tai:3,method:'self',discarder:1,gangPlayer:0}};
      persist(); repaint(); showToast('Session started. Everyone has $30.00.'); return;
    }
    if (!session) return;
    const m = derive(session);
    const d = ui.draft;
    if (action==='tab') { ui.tab=button.dataset.value; repaint(); return; }
    if (action==='flower-no') { d.flower=Number(button.dataset.value); repaint(); return; }
    if (action==='choose-tai') { d.tai=Number(button.dataset.value); repaint(); return; }
    if (action==='method') { d.method=button.dataset.value; repaint(); return; }
    if (action==='add-flower') {
      if (m.current.flowers.includes(d.flower)) { showToast('That flower pair has already been paid this hand.'); return; }
      const credits = flowerTransfers(m.east,d.collector,d.flower,d.initial).reduce((a,t)=>a+t.cents,0);
      addAction({type:'flower',collector:d.collector,flower:d.flower,initial:d.initial},`${name(d.collector)} received ${money(credits)} for flowers.`);
      d.initial=false;
      const next = [1,2,3,4].find(n => !derive(session).current.flowers.includes(n));
      if (next) d.flower=next;
      repaint(); return;
    }
    if (action==='record-win') {
      if (d.method==='discard' && d.discarder===d.winner) { showToast('The discarder cannot also be the winner.'); return; }
      const oldEast=m.east;
      const gain=winningTransfers(d.winner,d.tai,d.method,d.discarder).reduce((a,t)=>a+t.cents,0);
      const winnerName=name(d.winner);
      addAction({type:'win',winner:d.winner,tai:d.tai,method:d.method,discarder:d.method==='discard'?d.discarder:null}, `${winnerName} won ${money(gain)}. ${d.winner===oldEast?'East stays.':'East passes to '+name((oldEast+1)%4)+'.'}`);
      d.initial=false; d.flower=1; ui.tab='flower'; repaint(); return;
    }
    if (action==='record-gang') {
      addAction({type:'gang',player:d.gangPlayer},`${name(d.gangPlayer)} declared Gang. No money changed.`);
      ui.tab='flower'; repaint(); return;
    }
    if (action==='draw-confirm') { ui.modal='draw'; repaint(); return; }
    if (action==='confirm-draw') {
      const extraRaw = document.getElementById('draw-extra-gang')?.value ?? '';
      const extraGang = extraRaw === '' ? null : Number(extraRaw);
      const hasNonEastGang = m.current.gangs.some(p => p !== m.east) || (extraGang !== null && extraGang !== m.east);
      const nextEast = hasNonEastGang ? (m.east+1)%4 : m.east;
      ui.modal=null;
      addAction({type:'draw',extraGang},`Draw recorded. ${hasNonEastGang ? 'Non-East Gang: East passes to '+name(nextEast)+'.' : name(m.east)+' stays East.'}`);
      d.initial=false; d.flower=1; ui.tab='flower'; repaint(); return;
    }
    if (action==='change-east') { if (m.current.events.length) { showToast('Finish this hand before choosing a new East.'); return; } ui.modal='east'; repaint(); return; }
    if (action==='set-east') {
      if (m.current.events.length) return;
      const east=Number(button.dataset.value);
      if (east!==m.east) addAction({type:'setEast',east},`${name(east)} is now East.`);
      ui.modal=null; repaint(); return;
    }
    if (action==='undo') {
      if (!session.actions.length) return;
      session.actions.pop(); persist(); d.initial=false; ui.modal=null; repaint(); showToast('Last action undone. Balances recalculated.'); return;
    }
    if (action==='all-history') { ui.allHistory=!ui.allHistory; repaint(); return; }
    if (action==='export') { ui.modal=null; repaint(); downloadCSV(); return; }
    if (action==='more') { ui.modal='more'; repaint(); return; }
    if (action==='edit-names') { ui.modal='names'; repaint(); return; }
    if (action==='save-names') {
      const names=validateNames([0,1,2,3].map(i=>'edit-name-'+i));
      if (!names) return;
      session.players=names; persist(); ui.modal=null; repaint(); showToast('Player names updated.'); return;
    }
    if (action==='reset-confirm') { ui.modal='reset'; repaint(); return; }
    if (action==='confirm-reset') {
      try {localStorage.removeItem(STORAGE_KEY);} catch(e){}
      session=null; ui.modal=null; ui.tab='flower'; ui.allHistory=false; repaint(); showToast('New session ready.'); return;
    }
  }
  root.addEventListener('click', function (event) {
    const target = event.target.closest('[data-action]');
    if (!target || target.disabled) return;
    handleAction(target.dataset.action,target);
  });
  document.addEventListener('click', function (event) {
    if (event.target.id === 'modal-backdrop') { ui.modal=null; repaint(); return; }
    const target=event.target.closest('#modal-container [data-action]');
    if (!target || target.disabled) return;
    handleAction(target.dataset.action,target);
  });
  root.addEventListener('change', function (event) {
    const t=event.target;
    if (t.matches('input[name="setup-east"]')) {
      document.querySelectorAll('[data-setup-east-label]').forEach(label=>label.classList.toggle('active',label.dataset.setupEastLabel===t.value));
      return;
    }
    const field=t.dataset.field;
    if (!field || !session) return;
    if (field==='initial') ui.draft.initial=t.checked;
    else ui.draft[field]=Number(t.value);
    repaint();
  });
  root.addEventListener('input', function (event) {
    if (!event.target.id?.startsWith('setup-player-')) return;
    const i=Number(event.target.id.split('-').at(-1));
    const preview=document.querySelector(`[data-setup-name-preview="${i}"]`);
    if (preview) preview.textContent=event.target.value.trim() || `Seat ${i+1}`;
  });
  document.addEventListener('change', function (event) {
    if (event.target.id !== 'draw-extra-gang' || !session) return;
    const m = derive(session);
    const raw = event.target.value;
    const hasNonEastGang = m.current.gangs.some(p => p !== m.east) || (raw !== '' && Number(raw) !== m.east);
    const nextEast = hasNonEastGang ? (m.east+1)%4 : m.east;
    const node = document.getElementById('draw-east-prediction');
    if (node) node.textContent = hasNonEastGang ?
      `Non-East Gang: East passes from ${name(m.east)} to ${name(nextEast)} on the next hand.` :
      `No non-East Gang: ${name(m.east)} stays East on the next hand.`;
  });
  document.addEventListener('keydown', function (event) {
    if (event.key==='Escape' && ui.modal) {ui.modal=null; repaint();}
  });
  // Exposes deterministic, pure calculations for optional automated verification.
  window.MahjongLedgerLogic={derive,flowerTransfers,winningTransfers,BASE_CENTS,STARTING_CENTS};
  repaint();
})();
</script>
</body>
