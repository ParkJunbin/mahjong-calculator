<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3ED">
  <title>Mahjong Ledger | Singapore Mahjong Money Tracker</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f5;
      --paper: #fff;
      --ink: #182a27;
      --muted: #687a75;
      --line: #dce7e1;
      --green: #176a52;
      --green-dark: #104c3b;
      --green-pale: #e9f5ee;
      --red: #b3454c;
      --red-pale: #fff0ef;
      --cream: #f9f7ee;
      --shadow: 0 7px 32px rgba(19, 55, 40, .045);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.42; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    :focus-visible { outline: 3px solid #54ad91; outline-offset: 3px; }
    .shell { max-width: 1200px; padding: 25px 24px 80px; margin: 0 auto; }
    .sitebar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 29px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-icon { height: 45px; width: 45px; border: 2px solid #134c3c; background: #fff; color: #164c3b; display: grid; place-items: center; font-size: 24px; font-weight: 750; border-radius: 12px; box-shadow: 3px 3px 0 #c8e8d6; flex: none; }
    .brand-name { font-size: 21px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 4px; letter-spacing: .3px; }
    .nav { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 11px; padding: 10px 14px; min-height: 43px; font-size: 13px; font-weight: 700; transition: border .15s, background .15s, transform .15s; }
    .btn:hover:not(:disabled) { background: #f4faf6; border-color: #a7c8ba; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
    .btn.primary:hover:not(:disabled) { background: var(--green-dark); }
    .btn.secondary { background: var(--green-pale); color: var(--green-dark); border-color: #cce6d6; }
    .btn.danger { color: var(--red); }
    .btn.wide { width: 100%; }
    .btn.big { padding: 14px 17px; font-size: 15px; min-height: 52px; }
    .btn.small { min-height: 32px; border-radius: 9px; padding: 6px 10px; font-size: 12px; }
    .btn.link-btn { border: 0; background: transparent; padding-inline: 5px; color: var(--green); }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: 1.2px; }
    .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; margin-bottom: 19px; }
    h1,h2,h3,p { margin: 0; }
    h1 { font-size: clamp(24px, 3vw, 34px); letter-spacing: -1.2px; line-height: 1.22; margin-top: 4px; }
    h2 { font-size: 19px; letter-spacing: -.45px; }
    h3 { font-size: 15px; letter-spacing: -.15px; }
    .subtitle { color: var(--muted); margin-top: 8px; font-size: 13px; }
    .total-pill { border: 1px solid #cce6d6; background: #e9f6ed; border-radius: 12px; padding: 11px 15px; text-align: right; white-space: nowrap; }
    .total-pill .total-label { font-size: 11px; color: #476e5c; font-weight: 750; }
    .total-pill strong { font-size: 20px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
    .total-pill.error { border-color: #efb7bb; background: var(--red-pale); color: var(--red); }
    .player-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 21px; }
    .player { background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 17px; padding: 17px 17px 15px; min-width: 0; }
    .player.east { border: 1.5px solid #68a990; background: linear-gradient(150deg, #eff9f2 0%, #fff 71%); }
    .player-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    .player-name { font-weight: 760; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .wind-tag { border-radius: 7px; padding: 4px 7px; background: #edf0ec; color: #63736d; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .east .wind-tag { background: #d8efdf; color: #175a41; }
    .player-money { font-size: clamp(23px, 2.7vw, 34px); font-weight: 820; letter-spacing: -.8px; padding-top: 19px; padding-bottom: 7px; font-variant-numeric: tabular-nums; }
    .player-foot { display: flex; align-items: center; justify-content: space-between; gap: 5px; font-size: 12px; }
    .delta { font-weight: 800; font-variant-numeric: tabular-nums; }
    .gain { color: var(--green); }
    .loss { color: var(--red); }
    .neutral { color: var(--muted); }
    .main-grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(295px, .9fr); gap: 18px; align-items: start; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-pad { padding: 22px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-head p { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #eef3ef; border-radius: 12px; padding: 4px; margin: 22px 0 20px; gap: 4px; }
    .tab { border: 0; background: transparent; color: var(--muted); min-height: 42px; font-size: 12px; font-weight: 740; border-radius: 9px; }
    .tab.active { background: #fff; color: var(--green-dark); box-shadow: 0 2px 8px rgba(23, 66, 42, .09); }
    .field { margin-bottom: 20px; }
    .field label, .field-title { display: block; font-size: 12px; font-weight: 800; margin-bottom: 9px; }
    select, .text-input { width: 100%; border: 1px solid #ceded5; background: #fff; border-radius: 10px; color: var(--ink); padding: 11px 12px; min-height: 46px; font-size: 14px; }
    select:hover, .text-input:hover { border-color: #9bbfaf; }
    .fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .choices.tai-choices { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .tai-choices .choice b { font-size: 15px; white-space: nowrap; }
    .choice { min-height: 63px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; color: var(--ink); }
    .choice b { display: block; font-size: 17px; }
    .choice small { display: block; font-size: 10px; margin-top: 3px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; }
    .choice.selected { border: 1.5px solid var(--green); color: var(--green-dark); background: #ebf7ef; box-shadow: inset 0 0 0 1px #b8dfc9; }
    .choice.taken { background: #f7f8f7; }
    .choice.taken small { color: var(--red); }
    .check-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; border: 1px solid var(--line); background: #fafcf9; padding: 13px; border-radius: 11px; margin: 0 0 18px; }
    .check-row input { appearance: auto; width: 18px; height: 18px; flex: none; accent-color: var(--green); margin: 1px 0 0; }
    .check-row strong { font-size: 13px; display: block; margin-bottom: 3px; }
    .check-row small { font-size: 11px; color: var(--muted); display: block; line-height: 1.5; }
    .preview { background: #f2f8f4; border: 1px solid #d9ebdf; padding: 15px; border-radius: 12px; margin: 0 0 17px; }
    .preview-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .preview span.micro, .micro { font-size: 11px; color: var(--muted); font-weight: 720; }
    .preview strong.amount { font-size: 24px; font-weight: 850; color: var(--green-dark); font-variant-numeric: tabular-nums; }
    .preview-list { display: flex; gap: 5px; flex-wrap: wrap; color: #425d4e; font-size: 12px; margin-top: 7px; }
    .note { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .warning { background: #fff7e9; border: 1px solid #f2d9a6; border-radius: 11px; padding: 12px; color: #755a27; font-size: 12px; margin-bottom: 16px; }
    .method-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .gang-mode-list { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .gang-mode-list .method { min-height: 60px; }
    .method { min-height: 73px; padding: 12px; border-radius: 11px; border: 1px solid var(--line); background: #fff; text-align: left; }
    .method strong { font-size: 13px; display: block; }
    .method small { font-size: 11px; color: var(--muted); display: block; margin-top: 4px; }
    .method.selected { background: var(--green-pale); border: 1.5px solid var(--green); }
    .sidebar { display: grid; gap: 17px; }
    .round-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; border: 1px solid #cfe8d9; padding: 13px; background: #edf8f0; border-radius: 12px; }
    .round-meta small { color: #628071; display: block; font-size: 11px; margin-bottom: 3px; }
    .round-meta strong { font-size: 18px; letter-spacing: -.4px; }
    .round-meta .east-seal { width: 43px; height: 43px; border-radius: 11px; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 850; flex: none; }
    .current-flowers { margin-top: 16px; }
    .empty-copy { border: 1px dashed #d6e2db; color: var(--muted); font-size: 12px; padding: 14px; margin-top: 9px; border-radius: 10px; background: #fcfdfc; }
    .flower-mini { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid #eef1ef; font-size: 12px; }
    .flower-mini b { font-weight: 750; }
    .divider { height: 1px; background: var(--line); margin: 18px 0; }
    .round-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .round-actions .btn { flex: 1 1 auto; }
    .hand-help { padding: 15px 19px; background: #fafbf9; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.6; }
    .rules-mini { background: var(--cream); border: 1px solid #eae5cf; border-radius: 15px; padding: 17px; }
    .rules-mini h3 { margin-bottom: 11px; }
    .rules-mini p { font-size: 12px; margin-top: 7px; color: #5e675d; line-height: 1.6; }
    .history-section { margin-top: 24px; }
    .history-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 13px; }
    .history-list { display: grid; gap: 11px; }
    .history-hand { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; }
    .history-hand-header { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 7px; }
    .history-hand-title { font-size: 13px; font-weight: 800; }
    .badge { display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; padding: 4px 8px; font-size: 10px; font-weight: 800; background: #f1f3f1; color: var(--muted); }
    .badge.positive { color: var(--green-dark); background: #e8f6ed; }
    .badge.draw { background: #f1f3f1; }
    .history-event { padding: 10px 0; border-top: 1px solid #eff3ef; }
    .history-event-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
    .history-event-header strong { font-weight: 740; }
    .history-event-header .money { color: var(--green); font-weight: 810; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .history-transfer { font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 5px; overflow-wrap: anywhere; }
    .empty-history { padding: 25px; text-align: center; background: #fff; border: 1px dashed #d4e2d9; border-radius: 13px; font-size: 13px; color: var(--muted); }
    .footer { margin-top: 27px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #163e32; color: #fff; border-radius: 10px; padding: 11px 17px; z-index: 100; font-size: 13px; font-weight: 700; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px #183a3040; text-align: center; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: #10251e95; display: grid; place-items: center; padding: 20px; }
    .modal { background: #fff; border-radius: 19px; width: min(100%, 510px); box-shadow: 0 20px 100px #031a1740; max-height: min(85vh, 790px); overflow-y: auto; }
    .modal-head { padding: 22px 24px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .modal-body { padding: 10px 24px 24px; }
    .modal-body p { color: var(--muted); font-size: 13px; margin-bottom: 15px; line-height: 1.6; }
    .modal-close { background: transparent; border: 0; font-size: 25px; color: var(--muted); line-height: 1; padding: 0 3px; }
    .banker-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .banker-opt { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; border-radius: 11px; padding: 14px; border: 1px solid var(--line); background: #fff; text-align: left; min-height: 78px; }
    .banker-opt strong { font-size: 15px; }
    .banker-opt small { color: var(--muted); }
    .banker-opt.active { border: 2px solid var(--green); background: var(--green-pale); padding: 13px; }
    .modal-controls { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    .setup-shell { max-width: 850px; margin: 40px auto 0; }
    .setup-intro { text-align: center; margin-bottom: 24px; }
    .setup-intro h1 { margin: 10px auto; }
    .setup-intro p { color: var(--muted); font-size: 14px; }
    .setup-card { background: white; border: 1px solid var(--line); border-radius: 21px; padding: 27px; box-shadow: var(--shadow); }
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 17px; }
    .setup-field { display: flex; flex-direction: column; gap: 7px; }
    .setup-field label { font-size: 12px; font-weight: 800; }
    .seat-hint { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 7px; }
    .setup-bottom { background: #f1f7f2; border: 1px solid #d9e7dd; padding: 14px; border-radius: 12px; margin-top: 22px; color: #416654; font-size: 12px; line-height: 1.65; }
    .setup-start { margin-top: 20px; }
    .rules-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 10px 0 20px; }
    .rules-table td,.rules-table th { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: left; }
    .rules-table th { font-size: 11px; color: var(--muted); }
    .rules-table td:not(:first-child),.rules-table th:not(:first-child) { text-align: right; }
    @media (max-width: 930px) {
      .main-grid { grid-template-columns: minmax(0, 1fr); }
      .sidebar { grid-template-columns: 1fr 1fr; align-items: start; }
      .player-grid { gap: 10px; }
    }
    @media (max-width: 650px) {
      .shell { padding: 17px 13px 70px; }
      .sitebar { align-items: flex-start; margin-bottom: 24px; gap: 8px; }
      .brand-name { font-size: 18px; }
      .brand-sub { font-size: 10px; }
      .brand-icon { width: 39px; height: 39px; }
      .nav { gap: 4px; }
      .nav .btn { min-height: 34px; padding: 7px 9px; font-size: 11px; }
      .hero-row { align-items: center; }
      .hero-row h1 { font-size: 25px; }
      .hero-row .subtitle { font-size: 11px; }
      .total-pill { padding: 8px 10px; }
      .total-pill strong { font-size: 16px; }
      .total-pill .total-label { font-size: 10px; }
      .player-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
      .player { padding: 13px 12px; border-radius: 14px; }
      .player-name { font-size: 13px; }
      .wind-tag { font-size: 9px; padding: 3px 5px; }
      .player-money { padding-top: 14px; font-size: 26px; }
      .player-foot { font-size: 11px; }
      .panel-pad { padding: 17px; }
      .sidebar { grid-template-columns: 1fr; }
      .setup-shell { margin-top: 5px; }
      .setup-card { padding: 18px; }
      .setup-grid { gap: 10px; }
      .setup-intro h1 { font-size: 27px; }
      .setup-intro p { font-size: 12px; }
    }
    @media (max-width: 375px) {
      .brand-icon { display: none; }
      .hero-row { flex-wrap: wrap; }
      .fields-2 { grid-template-columns: 1fr; }
      .player-money { font-size: 23px; }
      .choices { gap: 5px; }
      .choice small { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .btn { transition: none; }
    }

/* Mahjong Ledger — warm paper and terracotta theme */
:root {
  --bg: #F7F3ED;

  --line: #E5DCD2;
  --green: #B35C43;
  --green-dark: #91432E;
  --green-pale: #F8EBE4;
  --red: #A94442;
  --red-pale: #FBEEEB;
  --cream: #F5EDE2;
  --shadow: 0 1px 3px rgba(62,43,31,.028);
}
body {

  color: var(--ink);

}

}

}

.delta { font-weight: 730; }
.gain { color: #426B4C; }
.loss { color: #A94442; }
.main-grid { gap: 17px; }
.panel {

  border-color: #E5DCD2;

  box-shadow: none;
}

<body>
<div id="app"></div>
<script>
'use strict';
(function () {
  const STORAGE_KEY = 'sg-mahjong-ledger.v1';
  const STARTING_CENTS = 3000;
  const BASE_CENTS = [0, 80, 160, 320, 640, 1280];
  const SELF_GANG_CENTS = 20;
  const FLOWER_SET_CENTS = 40;
  const FLOWER_SET_NAMES = {flowers:'Flowers (1–4)', seasons:'Seasons (1–4)'};
  const WINDS = ['East', 'South', 'West', 'North'];
  const WIND_CHARS = ['東', '南', '西', '北'];
  const defaultNames = ['Player 1', 'Player 2', 'Player 3', 'Player 4'];
  const root = document.getElementById('app');
  let session = loadSession();
  let ui = { tab: 'flower', modal: null, allHistory: false, toast: '', draft: { collector: 0, flower: 1, flowerMode:'pair', flowerSet:'flowers', initial: false, winner: 0, tai: 3, method: 'self', discarder: 1, gangPlayer: 0, gangMode:'self', gangPayer: null, gangAmount: '' } };
  let toastTimeout = null;

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
  }
  function money(cents) { return '$' + (cents / 100).toFixed(2); }
  function parseMoneyInput(raw) {
    const cleaned = String(raw ?? '').trim().replace(/^\$/, '');
    if (!/^-?\d+(?:\.\d{1,2})?$/.test(cleaned)) return null;
    const sign = cleaned.startsWith('-') ? -1 : 1;
    const unsigned = cleaned.replace(/^-/, '');
    const [whole, fraction = ''] = unsigned.split('.');
    const cents = sign * (Number(whole) * 100 + Number(fraction.padEnd(2, '0')));
    return Number.isSafeInteger(cents) && Math.abs(cents) <= 100000000 ? cents : null;
  }
  function startingBalances(s) {
    const arr = s.initialBalances;
    return Array.isArray(arr) && arr.length === 4 && arr.every(v=>Number.isSafeInteger(v) && Math.abs(v) <= 100000000)
      ? arr.slice() : [STARTING_CENTS, STARTING_CENTS, STARTING_CENTS, STARTING_CENTS];
  }
  function signed(cents) { return (cents > 0 ? '+' : cents < 0 ? '-' : '') + money(Math.abs(cents)); }
  function safeName(index) { return escapeHTML(session.players[index]); }
  function name(index) { return session.players[index]; }
  function fromEast(east, flowerNo) { return (east + flowerNo - 1) % 4; }
  function windOfPlayer(east, player) { return (player - east + 4) % 4; }

  function flowerTransfers(east, collector, flower, initial) {
    const owner = fromEast(east, flower);
    const perPayer = initial ? 40 : 20;
    if (owner === collector) {
      return [0, 1, 2, 3].filter(p => p !== collector).map(from => ({ from, to: collector, cents: perPayer }));
    }
    return [{ from: owner, to: collector, cents: perPayer }];
  }
  function flowerSetTransfers(collector) {
    return [0,1,2,3].filter(p=>p!==collector).map(from=>({from,to:collector,cents:FLOWER_SET_CENTS}));
  }
  function selfGangTransfers(player) {
    return [0,1,2,3].filter(p=>p!==player).map(from=>({from,to:player,cents:SELF_GANG_CENTS}));
  }
  function winningTransfers(winner, tai, method, discarder) {
    const amount = BASE_CENTS[tai];
    if (method === 'self') {
      return [0, 1, 2, 3].filter(p => p !== winner).map(from => ({ from, to: winner, cents: amount / 2 }));
    }
    return [{ from: discarder, to: winner, cents: amount }];
  }
  function addTransfers(balances, transfers) {
    transfers.forEach(t => { balances[t.from] -= t.cents; balances[t.to] += t.cents; });
  }
  function newHand(number, east) { return { number, east, flowers: [], flowerSets: [], gangs: [], events: [], outcome: null }; }
  function shotStatistics(hands) {
    const entries = [0,1,2,3].map(player => ({player, gangShots:0, gangPaid:0, winningDiscards:0, winPaid:0, totalShots:0, totalPaid:0, gangsClaimed:0}));
    for (const hand of hands) for (const event of hand.events) {
      if (event.type === 'gang') {
        entries[event.player].gangsClaimed++;
        if (Number.isInteger(event.payer) && event.transfers.length) {
          entries[event.payer].gangShots++;
          entries[event.payer].gangPaid += event.transfers.reduce((sum,t)=>sum+t.cents,0);
        }
      }
      if (event.type === 'win' && event.method === 'discard' && Number.isInteger(event.discarder)) {
        entries[event.discarder].winningDiscards++;
        entries[event.discarder].winPaid += event.transfers.reduce((sum,t)=>sum+t.cents,0);
      }
    }
    entries.forEach(e=>{e.totalShots=e.gangShots+e.winningDiscards; e.totalPaid=e.gangPaid+e.winPaid;});
    return entries;
  }
  function derive(s) {
    const initialBalances = startingBalances(s);
    const balances = initialBalances.slice();
    const earned = [0,0,0,0];  // Mahjong earnings only; excludes manual corrections.
    let expectedTotal = initialBalances.reduce((a,b)=>a+b,0);
    const startHand = Number.isInteger(s.startHand) && s.startHand >= 1 && s.startHand <= 9999 ? s.startHand : 1;
    const hands = [];
    let east = s.initialEast;
    let current = newHand(startHand, east);
    for (let ai = 0; ai < s.actions.length; ai++) {
      const action = s.actions[ai];
      if (action.type === 'setEast') {
        east = action.east;
        current.east = east;
        continue;
      }
      if (action.type === 'flower') {
        const transfers = flowerTransfers(east, action.collector, action.flower, action.initial);
        addTransfers(balances, transfers); addTransfers(earned, transfers);
        const event = { type: 'flower', actionIndex: ai, collector: action.collector, flower: action.flower, initial: action.initial, transfers };
        current.events.push(event);
        current.flowers.push(action.flower);
        continue;
      }
      if (action.type === 'flowerSet') {
        if (!Object.hasOwn(FLOWER_SET_NAMES,action.set) || current.flowerSets.includes(action.set) || !Number.isInteger(action.collector) || action.collector<0 || action.collector>3) continue;
        const transfers=flowerSetTransfers(action.collector);
        addTransfers(balances,transfers); addTransfers(earned,transfers);
        current.events.push({type:'flowerSet',actionIndex:ai,collector:action.collector,set:action.set,transfers});
        current.flowerSets.push(action.set);
        continue;
      }
      if (action.type === 'gang') {
        // Older saved sessions had no mode: preserve their single-payer/unpaid payments exactly.
        const legacyPayer=Number.isInteger(action.payer) && action.payer>=0 && action.payer<4 && action.payer!==action.player && Number.isSafeInteger(action.cents) && action.cents>0 ? action.payer : null;
        const mode=['self','shot','unpaid'].includes(action.mode)?action.mode:(legacyPayer===null?'unpaid':'shot');
        const payer=mode==='shot'?legacyPayer:null;
        const transfers=mode==='self'?selfGangTransfers(action.player):payer===null?[]:[{from:payer,to:action.player,cents:action.cents}];
        addTransfers(balances,transfers); addTransfers(earned,transfers);
        const event={type:'gang',actionIndex:ai,player:action.player,mode,payer,cents:transfers.reduce((sum,t)=>sum+t.cents,0),transfers};
        current.events.push(event);
        current.gangs.push(action.player);
        continue;
      }
      if (action.type === 'balanceCorrection') {
        if (!Array.isArray(action.balances) || action.balances.length !== 4 || !action.balances.every(v=>Number.isSafeInteger(v))) continue;
        const previous = balances.slice();
        const next = action.balances.slice();
        const changes = next.map((c,i)=>c-previous[i]);
        changes.forEach((v,i)=>{balances[i] = next[i];});
        expectedTotal += changes.reduce((a,b)=>a+b,0);
        current.events.push({type:'adjust', actionIndex:ai, previous, next, changes, transfers:[]});
        continue;
      }
      if (action.type === 'win') {
        const transfers = winningTransfers(action.winner, action.tai, action.method, action.discarder);
        addTransfers(balances, transfers); addTransfers(earned, transfers);
        const event = { type:'win', actionIndex:ai, winner:action.winner, tai:action.tai, method:action.method, discarder:action.discarder, transfers };
        current.events.push(event);
        current.outcome = event;
        hands.push(current);
        if (action.winner !== east) east = (east+1)%4;
        current = newHand(current.number+1,east);
        continue;
      }
      if (action.type === 'draw') {
        if (Number.isInteger(action.extraGang) && action.extraGang >= 0 && action.extraGang < 4) {
          current.gangs.push(action.extraGang);
          current.events.push({type:'gang', actionIndex:ai, player:action.extraGang, payer:null, cents:0, quickEntry:true, transfers:[]});
        }
        const nonEastGang = current.gangs.some(player=>player!==east);
        const nextEast = nonEastGang ? (east+1)%4 : east;
        current.outcome = {type:'draw', actionIndex:ai, nonEastGang, nextEast, transfers:[]};
        hands.push(current);
        east = nextEast;
        current = newHand(current.number+1,east);
        continue;
      }
    }
    hands.push(current);
    return {balances, earned, hands, current, east, total:balances.reduce((a,b)=>a+b,0), expectedTotal, initialBalances, startHand, shotStats:shotStatistics(hands)};
  }
  function loadSession() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 1 || !Array.isArray(parsed.players) || parsed.players.length !== 4 || !parsed.players.every(x => typeof x === 'string') || !Number.isInteger(parsed.initialEast) || parsed.initialEast < 0 || parsed.initialEast > 3 || !Array.isArray(parsed.actions)) return null;
      return parsed;
    } catch (err) { return null; }
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); }
    catch (err) { showToast('Your browser could not save locally. Export a CSV as backup.'); }
  }
  function showToast(msg) {
    ui.toast = msg;
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg;
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { if (el.isConnected) el.remove(); ui.toast = ''; }, 2700);
  }
  function addAction(action, feedback) {
    session.actions.push({ ...action, timestamp: new Date().toISOString() });
    persist();
    render();
    if (feedback) showToast(feedback);
  }
  function playerOptions(selected, excluding = null) {
    return session.players.map((n,i) => i === excluding ? '' : `<option value="${i}" ${selected === i ? 'selected' : ''}>${escapeHTML(n)}</option>`).join('');
  }
  function setupView() {
    return `
      <main class="shell">
        <header class="sitebar"><div class="brand"><div class="brand-icon" aria-hidden="true">東</div><div><div class="brand-name">Mahjong Ledger</div><div class="brand-sub">SINGAPORE MAHJONG</div></div></div><button type="button" class="btn" data-action="rules">View rules</button></header>
        <section class="setup-shell">
          <div class="setup-intro"><div class="eyebrow">New game · Four players</div><h1>Set up the table</h1><p>Enter the players in seat order and choose East. Start at $30 each, or resume from the middle of a game.</p></div>
          <div class="setup-card">
            <div class="panel-head"><div><h2>Who's playing?</h2><p>Enter names in banker rotation order.</p></div><span class="badge positive">$30.00 each</span></div>
            <div class="setup-grid">
              ${defaultNames.map((n,i) => `<div class="setup-field"><label for="setup-player-${i}">Seat ${i+1}</label><input class="text-input" id="setup-player-${i}" maxlength="28" value="${escapeHTML(n)}" autocomplete="off" aria-label="Seat ${i+1} name"></div>`).join('')}
            </div>
            <p class="seat-hint">Seat order is the banker rotation order: Seat 1 → Seat 2 → Seat 3 → Seat 4 → Seat 1. Flower numbers follow the current East banker: East = 1, South = 2, West = 3, North = 4.</p>
            <div class="divider"></div>
            <div class="field-title">Who starts as banker (東 / East)?</div>
            <div class="banker-options" id="setup-east-options">${defaultNames.map((n,i) => `<label class="banker-opt ${i===0 ? 'active' : ''}" data-setup-east-label="${i}"><span><input type="radio" name="setup-east" value="${i}" ${i===0 ? 'checked' : ''}> &nbsp;Seat ${i+1}</span><strong data-setup-name-preview="${i}">${escapeHTML(n)}</strong></label>`).join('')}</div>
            <label class="check-row resume-choice" for="setup-resume"><input id="setup-resume" type="checkbox"><span><strong>Start partway through a game</strong><small>Enter current balances, current hand number, and select the current East above.</small></span></label>
            <div class="resume-panel" id="resume-fields" hidden>
              <h3>Balances at the point you begin tracking</h3>
              <p class="note">Enter the actual amount each player has right now, not their original $30. These are opening snapshots; earlier shots and wins cannot be counted automatically.</p>
              <div class="setup-grid">${defaultNames.map((n,i)=>`<div class="setup-field"><label for="resume-balance-${i}">Seat ${i+1} · $AUD</label><input class="text-input" id="resume-balance-${i}" type="number" inputmode="decimal" step="0.01" value="30.00"></div>`).join('')}</div>
              <div class="field" style="margin:18px 0 11px"><label for="setup-hand">Current hand number</label><input class="text-input" id="setup-hand" type="number" inputmode="numeric" min="1" max="9999" value="1"></div>
              <p class="resume-total" id="resume-total">Current table total: <b>$120.00</b></p>
            </div>
            <div class="setup-bottom"><strong>Standard start:</strong> $30.00 per player. For a game already in progress, turn on <em>Start partway through</em> and enter the four balances. This browser saves the hand history automatically.</div>
            <button type="button" class="btn primary big wide setup-start" data-action="start">Start session &rarr;</button>
          </div>
        </section>
      </main>`;
  }
  function playerCards(model) {
    return `<div class="player-grid">${session.players.map((player,i) => {

  }
  function flowerForm(model) {

    </div></div>`;
    if(d.flowerMode==='set') {
      const taken=model.current.flowerSets;

      return `${modeChoices}
        <div class="field"><label for="set-collector">Who collected the complete same-colour set?</label><select id="set-collector" data-field="collector">${playerOptions(d.collector)}</select></div>
        <div class="field"><div class="field-title">Which group of four tiles?</div><div class="method-choices">
          ${Object.entries(FLOWER_SET_NAMES).map(([key,label])=>`<button type="button" class="method ${d.flowerSet===key?'selected':''}" data-action="flower-set" data-value="${key}" aria-pressed="${d.flowerSet===key}"><strong>${label}</strong><small>${taken.includes(key)?'Already recorded this hand':'Four tiles · one colour'}</small></button>`).join('')}
        </div><p class="note" style="margin-top:8px">A same-colour set means all four numbers (1–4) from one flower or season group. This bonus is separate from number-pair bonuses and is not doubled in the initial deal.</p></div>
        ${already?`<div class="warning">The ${FLOWER_SET_NAMES[d.flowerSet]} set has already been paid this hand.</div>`:''}
        <div class="preview"><div class="preview-top"><span class="micro">COMPLETE COLOUR SET</span><strong class="amount">+${money(received)}</strong></div><div class="preview-list">Each of the other three players pays <b>${safeName(d.collector)}</b> ${money(FLOWER_SET_CENTS)}.</div></div>
        <button type="button" class="btn primary wide big" data-action="add-flower-set" ${already||full?'disabled':''}>${full?'Both colour sets recorded':'Record set bonus'} &rarr;</button>`;
    }
    const taken = model.current.flowers;
    const already = taken.includes(d.flower);
    const owner = fromEast(model.east, d.flower);
    const own = owner === d.collector;
    const transfers = flowerTransfers(model.east, d.collector, d.flower, d.initial);
    const received = transfers.reduce((sum,x) => sum + x.cents, 0);
    const full = taken.length >= 4;
    return `${modeChoices}
      <div class="field"><label for="flower-collector">Who collected both flowers?</label><select id="flower-collector" data-field="collector">${playerOptions(d.collector)}</select></div>
      <div class="field"><div class="field-title">Which flower number was collected?</div><div class="choices" role="group" aria-label="Flower number">
        ${[1,2,3,4].map(n => {
          const p = fromEast(model.east, n);
          return `<button type="button" class="choice ${d.flower===n?'selected':''} ${taken.includes(n)?'taken':''}" data-action="flower-no" data-value="${n}" aria-pressed="${d.flower===n}"><b>${n}</b><small>${taken.includes(n)?'Recorded':escapeHTML(name(p))}</small></button>`;
        }).join('')}
      </div><p class="note" style="margin-top:8px">Flower 1 = East, 2 = South, 3 = West, 4 = North. Ownership follows the current banker.</p></div>
      <label class="check-row" for="flower-initial"><input id="flower-initial" type="checkbox" data-field="initial" ${d.initial?'checked':''}><span><strong>Both were in the original dealt tiles (2×)</strong><small>Check only if both matching flowers were among the first tiles dealt. Flower-replacement draws do not count.</small></span></label>
      ${already ? `<div class="warning">Flower pair #${d.flower} has already been paid this hand. Choose a different number.</div>` : ''}
      <div class="preview"><div class="preview-top"><span class="micro">${own?'OWN FLOWER PAIR':'ANOTHER PLAYER\'S FLOWER PAIR'}</span><strong class="amount">+${money(received)}</strong></div><div class="preview-list">${own ? `Each of the other 3 players pays ${money(d.initial?40:20)} to <b>${safeName(d.collector)}</b>.` : `<b>${safeName(owner)}</b> pays <b>${safeName(d.collector)}</b> ${money(received)}.`}</div></div>
      <button type="button" class="btn primary wide big" data-action="add-flower" ${already||full?'disabled':''}>${full ? 'All four flower pairs recorded' : 'Record flower payment'} &rarr;</button>`;
  }
  function winForm(model) {
    const d = ui.draft;
    const transfers = winningTransfers(d.winner, d.tai, d.method, d.discarder);
    const received = transfers.reduce((sum,x) => sum+x.cents, 0);
    const nextEast = d.winner === model.east ? model.east : (model.east + 1) % 4;
    return `
      <div class="field"><label for="winner">Who won the hand?</label><select id="winner" data-field="winner">${playerOptions(d.winner)}</select></div>
      <div class="field"><div class="field-title">Winning Tai</div><div class="choices tai-choices" role="group" aria-label="Tai">
        ${[1,2,3,4,5].map(t => `<button type="button" class="choice ${d.tai===t?'selected':''}" data-action="choose-tai" data-value="${t}" aria-pressed="${d.tai===t}"><b>${t} <span style="font-size:10px">Tai</span></b><small>${money(BASE_CENTS[t])}</small></button>`).join('')}
      </div></div>
      <div class="field"><div class="field-title">How was the hand won?</div><div class="method-choices"><button type="button" class="method ${d.method==='self'?'selected':''}" data-action="method" data-value="self" aria-pressed="${d.method==='self'}"><strong>Self-draw</strong><small>Each opponent pays half</small></button><button type="button" class="method ${d.method==='discard'?'selected':''}" data-action="method" data-value="discard" aria-pressed="${d.method==='discard'}"><strong>Discard win</strong><small>Only discarder pays full</small></button></div></div>

      <div class="preview"><div class="preview-top"><span class="micro">${d.method === 'self'?'SELF-DRAW TOTAL':'DISCARD WIN TOTAL'}</span><strong class="amount">+${money(received)}</strong></div><div class="preview-list">${d.method === 'self'?`Each other player pays ${money(BASE_CENTS[d.tai]/2)} to <b>${safeName(d.winner)}</b>.`:`<b>${safeName(d.discarder)}</b> pays <b>${safeName(d.winner)}</b> ${money(BASE_CENTS[d.tai])}.`}</div></div>
      <p class="note" style="margin-bottom:12px">${d.winner===model.east?`East banker <b>${safeName(model.east)}</b> wins and stays East.`:`After this win, East passes to <b>${safeName(nextEast)}</b> (the next seat).`}</p>
      <button type="button" class="btn primary wide big" data-action="record-win">Record win & finish hand &rarr;</button>`;
  }
  function gangForm(model) {
    const d = ui.draft;
    const changesOnDraw = d.gangPlayer !== model.east || model.current.gangs.some(p => p !== model.east);
    const nextEast = (model.east+1)%4;
    const cents = parseMoneyInput(d.gangAmount);
    const isShot = d.gangMode==='shot';
    const isSelf = d.gangMode==='self';
    const amount = isSelf ? SELF_GANG_CENTS*3 : isShot && cents>0 ? cents : 0;
    return `
      <div class="field"><label for="gang-player">Who declared a Gang (four identical tiles)?</label><select id="gang-player" data-field="gangPlayer">${playerOptions(d.gangPlayer)}</select></div>
      <div class="field"><div class="field-title">How was the Gang claimed?</div><div class="gang-mode-list">
        <button type="button" class="method ${isSelf?'selected':''}" data-action="gang-mode" data-value="self" aria-pressed="${isSelf}"><strong>Self-claimed Gang</strong><small>All three opponents pay $0.20 each · receive $0.60</small></button>
        <button type="button" class="method ${isShot?'selected':''}" data-action="gang-mode" data-value="shot" aria-pressed="${isShot}"><strong>Another player paid for the Gang</strong><small>Choose the shooter and payment amount</small></button>
        <button type="button" class="method ${d.gangMode==='unpaid'?'selected':''}" data-action="gang-mode" data-value="unpaid" aria-pressed="${d.gangMode==='unpaid'}"><strong>Declaration only</strong><small>Record Gang for banker rotation, no payout</small></button>
      </div></div>
      ${isShot?`<div class="field"><label for="gang-payer">Who paid / shot this Gang?</label><select id="gang-payer" data-field="gangPayer">${session.players.map((n,i)=>i===d.gangPlayer?'':`<option value="${i}" ${d.gangPayer===i?'selected':''}>${escapeHTML(n)}</option>`).join('')}</select></div>
        <div class="field"><label for="gang-amount">Amount the shooter pays (AUD)</label><input class="text-input" id="gang-amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. 0.20" value="${escapeHTML(d.gangAmount)}" data-field="gangAmount"><p class="note" style="margin-top:6px">Enter the agreed amount paid by this one player. The Gang shot count increases by one.</p></div>`:''}
      <div class="preview"><div class="preview-top"><span class="micro">${isSelf?'SELF-CLAIMED GANG':isShot?'GANG SHOT PAYMENT':'GANG DECLARATION'}</span><strong class="amount" id="gang-shot-amount">${amount>0?'+'+money(amount):'$0.00'}</strong></div>
        <div class="preview-list" id="gang-shot-note">${isSelf?`Each of the other three players pays <b>${safeName(d.gangPlayer)}</b> ${money(SELF_GANG_CENTS)}. Nobody is counted as a Gang shooter.`:isShot?(cents>0?`<b>${safeName(d.gangPayer)}</b> pays <b>${safeName(d.gangPlayer)}</b> ${money(cents)}. Counts as one Gang shot.`:'Enter a positive payment amount to count a Gang shot.'):'No payment. This Gang still affects East on a draw.'}</div>
      </div>
      <p class="note" style="margin-bottom:13px">${changesOnDraw?`If the hand ends in a draw, East passes to <b>${safeName(nextEast)}</b>.`:`If the hand ends in a draw, <b>${safeName(model.east)}</b> stays East unless a non-East player declares Gang.`}</p>
      <button type="button" class="btn primary wide big" data-action="record-gang">Record Gang &rarr;</button>`;
  }
  function currentHandPanel(model) {
    const h = model.current;
    const flowerEvents = h.events.filter(e => e.type === 'flower' || e.type === 'flowerSet');
    const gangs = h.events.filter(e => e.type === 'gang');
    const nonEastGang = h.gangs.some(p => p !== model.east);
    return `<section class="panel"><div class="panel-pad">
      <div class="panel-head"><div><div class="eyebrow">Live hand</div><h2 style="margin-top:4px">Hand ${String(h.number).padStart(2,'0')}</h2></div><span class="badge positive">IN PROGRESS</span></div>
      <div class="round-meta"><div><small>CURRENT BANKER · 東 / EAST</small><strong>${safeName(model.east)}</strong></div><div class="east-seal" aria-label="East">東</div></div>
      <div style="margin-top:11px"><button type="button" class="btn secondary wide" data-action="change-east" ${h.events.some(e=>e.type!=='adjust')?'disabled title="Finish this hand before changing East"':''}>Choose / change East banker</button></div>
      ${h.events.some(e=>e.type!=='adjust')?'<p class="note" style="margin-top:7px">Banker is locked once a game event is recorded for this hand. Undo to correct it.</p>':''}
      <div class="current-flowers"><div class="panel-head"><h3>Flowers recorded</h3><span class="badge">${h.flowers.length} pairs · ${h.flowerSets.length} sets</span></div>
        ${flowerEvents.length ? flowerEvents.map(e=>`<div class="flower-mini"><span>${e.type==='flowerSet'?`Same-colour ${escapeHTML(FLOWER_SET_NAMES[e.set])}`:`Flower #${e.flower}${e.initial?' · 2×':''}`} · <b>${safeName(e.collector)}</b></span><strong class="gain">+${money(e.transfers.reduce((a,t)=>a+t.cents,0))}</strong></div>`).join('') : '<div class="empty-copy">No flower bonuses yet for this hand.</div>'}
      </div>
      <div class="current-flowers"><div class="panel-head"><h3>Declared Gangs</h3><span class="badge">${gangs.length} recorded</span></div>
        ${gangs.length ? gangs.map(e => `<div class="flower-mini"><span><b>${safeName(e.player)}</b> declared Gang${e.mode==='self'?` · +${money(e.cents)} self-claimed`:e.payer!==null?` · ${safeName(e.payer)} paid ${money(e.cents)}`:' · unpaid'}</span><strong class="${e.player!==model.east?'gain':'neutral'}">${e.player!==model.east?'Non-East':'East'}</strong></div>`).join('') : '<div class="empty-copy">No Gang recorded yet. You can also add a declaration-only Gang when marking a draw.</div>'}
      </div>
      <div class="divider"></div>
      <h3 style="margin-bottom:11px">No winner?</h3>
      <div class="round-actions"><button class="btn secondary wide" type="button" data-action="draw-confirm">Mark as draw & start next hand &rarr;</button></div>
      <p class="note" style="margin-top:9px">No winning payment on a draw. ${nonEastGang?`A non-East Gang is recorded, so East will pass to ${safeName((model.east+1)%4)}.`:'East stays unless a non-East player declared Gang.'}</p>
    </div><div class="hand-help"><b>Rotation:</b> East stays when East wins, or on a draw with no non-East Gang. If someone else wins—or a non-East player declares Gang on a drawn hand—East moves to the next seat. Balances carry forward.</div></section>`;
  }
  function summaryTransfers(transfers) {
    if (!transfers.length) return 'No money transferred.';
    if (transfers.length === 3 && transfers.every(t => t.to===transfers[0].to && t.cents===transfers[0].cents)) {
      return `${transfers.map(t=>safeName(t.from)).join(', ')} paid ${safeName(transfers[0].to)} ${money(transfers[0].cents)} each`;
    }
    return transfers.map(t=>`${safeName(t.from)} → ${safeName(t.to)} ${money(t.cents)}`).join(' · ');
  }
  function historyCard(h, isCurrent) {
    const last = h.outcome;
    const badge = !last ? 'CURRENT' : last.type==='draw' ? 'DRAW' : (name(last.winner)+' WON');
    const badgeCls = !last || last.type === 'win' ? 'positive' : 'draw';
    return `<article class="history-hand">
      <div class="history-hand-header"><div><div class="history-hand-title">Hand ${String(h.number).padStart(2,'0')} <span class="muted" style="font-weight:500">· East: ${safeName(h.east)}</span></div></div><span class="badge ${badgeCls}">${escapeHTML(badge)}</span></div>
      ${h.events.length ? h.events.map(e => {
        if (e.type === 'flower') {
          const own = fromEast(h.east,e.flower)===e.collector;
          return `<div class="history-event"><div class="history-event-header"><strong>Flower #${e.flower} · ${safeName(e.collector)} ${own?'(own pair)':'(other pair)'} ${e.initial?'· 2×':''}</strong><span class="money">+${money(e.transfers.reduce((a,t)=>a+t.cents,0))}</span></div><div class="history-transfer">${summaryTransfers(e.transfers)}</div></div>`;
        }
        if (e.type === 'flowerSet') {
          return `<div class="history-event"><div class="history-event-header"><strong>Same-colour set · ${escapeHTML(FLOWER_SET_NAMES[e.set])} · ${safeName(e.collector)}</strong><span class="money">+${money(e.transfers.reduce((a,t)=>a+t.cents,0))}</span></div><div class="history-transfer">${summaryTransfers(e.transfers)}</div></div>`;
        }
        if (e.type === 'gang') {
          const label=e.mode==='self'?'Self-claimed Gang':e.mode==='shot'?'Gang paid by shooter':'Gang declaration';
          const detail=e.mode==='self'?summaryTransfers(e.transfers)+' · No Gang shooter counted.':e.mode==='shot'?summaryTransfers(e.transfers)+' · Counts as one Gang shot.':'Gang declared without a payment.';
          return `<div class="history-event"><div class="history-event-header"><strong>${label} · ${safeName(e.player)} ${e.player===h.east?'(East)':'(non-East)'}</strong><span class="money">${e.transfers.length?'+'+money(e.cents):'No payment'}</span></div><div class="history-transfer">${detail} On a draw, a non-East Gang moves the banker.</div></div>`;
        }
        if (e.type === 'adjust') {
          const changes = e.changes.map((amount,i)=>amount===0?'':`${safeName(i)} ${signed(amount)}`).filter(Boolean).join(' · ');
          return `<div class="history-event"><div class="history-event-header"><strong>Balance correction</strong><span class="money" style="color:var(--muted)">Manual</span></div><div class="history-transfer">${changes || 'No difference'} · Does not count as a win or Gang shot.</div></div>`;
        }
        return `<div class="history-event"><div class="history-event-header"><strong>${e.tai} Tai · ${e.method==='self'?'Self-draw':'Discard'} · ${safeName(e.winner)}</strong><span class="money">+${money(e.transfers.reduce((a,t)=>a+t.cents,0))}</span></div><div class="history-transfer">${summaryTransfers(e.transfers)}</div></div>`;
      }).join('') : `<div class="history-transfer" style="margin-top:10px">${last && last.type==='draw'?'Drawn hand. No flower events.':'No events recorded.'}</div>`}
      ${last ? `<div class="history-transfer" style="border-top:1px solid #eff3ef; padding-top:9px; margin-top:5px"><b>Result:</b> ${last.type==='draw' ? (last.nonEastGang ? `Draw + non-East Gang — East passes to ${safeName(last.nextEast)}.` : 'Draw — East stays.') : last.winner===h.east ? `${safeName(h.east)} wins — East stays.`:`${safeName(last.winner)} wins — East passes to ${safeName((h.east+1)%4)}.`}</div>`:''}
    </article>`;
  }
  function historyPanel(model) {
    const completed = model.hands.slice().reverse();
    const shown = ui.allHistory ? completed : completed.slice(0, 5);
    return `<section class="history-section"><div class="history-title"><div><div class="eyebrow">Session</div><h2 style="margin-top:4px">Hand history</h2></div>${completed.length > 5?`<button class="btn small" type="button" data-action="all-history">${ui.allHistory?'Show latest 5':'View all '+completed.length}</button>`:''}</div>
      <div class="history-list">${completed.length===1 && !model.current.events.length ? '<div class="empty-history">Your payments and hand results will appear here as you play.</div>':shown.map(h => historyCard(h,h===model.current)).join('')}</div>

  }
  function shotPanel(model) {

      <div class="shot-grid">
        ${entries.map(e=>`<article class="shot-player"><div class="shot-player-head"><strong>${safeName(e.player)}</strong><span class="badge">${e.totalShots} shot${e.totalShots===1?'':'s'}</span></div>

          <div class="shot-player-bottom"><span>Total shot payments</span><strong>${money(e.totalPaid)}</strong></div>

    </div></section>`;

  function mainView() {
    const model = derive(session);

    const ok = model.total === model.expectedTotal;
    return `<main class="shell">
      <header class="sitebar"><div class="brand"><div class="brand-icon" aria-hidden="true">東</div><div><div class="brand-name">Mahjong Ledger</div><div class="brand-sub">SINGAPORE MAHJONG</div></div></div><nav class="nav" aria-label="Game controls"><button class="btn" type="button" data-action="undo" ${session.actions.length?'':'disabled'} title="Undo last action">Undo</button><button class="btn" type="button" data-action="edit-balances">Edit balances</button><a class="btn nav-link" href="#shot-stats">Shots</a><button class="btn" type="button" data-action="export">Export</button><button class="btn" type="button" data-action="more">Settings</button></nav></header>

          <div class="tabs" role="tablist" aria-label="Event type"><button class="tab ${ui.tab==='flower'?'active':''}" data-action="tab" data-value="flower" role="tab" aria-selected="${ui.tab==='flower'}">Flowers</button><button class="tab ${ui.tab==='win'?'active':''}" data-action="tab" data-value="win" role="tab" aria-selected="${ui.tab==='win'}">Win</button><button class="tab ${ui.tab==='gang'?'active':''}" data-action="tab" data-value="gang" role="tab" aria-selected="${ui.tab==='gang'}">Gang</button></div>

  function rulesModal() {
    return `<div class="modal-head"><div><div class="eyebrow">Rules reference</div><h2>Singapore Mahjong money rules</h2></div><button class="modal-close" type="button" data-action="close-modal" aria-label="Close">×</button></div><div class="modal-body">

      <p>If <b>both</b> matching flowers were in the <b>original first dealt tiles</b>, each payment is doubled to <b>$0.40</b>. Later flower replacements do not count as initially dealt. Each numbered pair can pay out only once per hand.</p>
      <h3>Four matching-colour flowers</h3><p style="margin-top:8px">If a player has all four numbered tiles (1–4) of the <b>same flower/season colour</b>, each opponent pays that player <b>$0.40</b>, for <b>$1.20 total</b>. This is a separate bonus from matching-number pairs. Each of the two colour sets can be claimed only once per hand, and it is <b>not doubled</b> by the initial dealt tiles.</p>
      <h3>Gang payments</h3><p style="margin-top:8px">For a <b>self-claimed Gang</b>, each of the other three players pays <b>$0.20</b> ($0.60 total). For a Gang paid for by another player, choose the shooter and enter the amount they paid; this records one Gang shot. A declaration-only Gang has no payment, but still counts for banker rotation.</p>
      <h3>East banker / 東風</h3><p style="margin-top:8px">East is flower number <b>1</b>. In the configured seat order, the next three players own flower numbers <b>2, 3, 4</b> (South, West, North). Flower-number ownership changes as East changes.</p>
      <p>If the <b>East banker wins</b>, the banker stays. If any other player wins, East moves to the next seat in the configured order. On a <b>draw</b>, East normally stays, <b>except when one or more non-East players declared Gang</b> (four identical tiles); then East advances one seat. An East player's Gang alone does not move East. Flower payments still apply on a drawn hand. A self-claimed Gang is paid by all three opponents. A shot Gang can instead have a single payer; declaration-only Gangs are also supported.</p>

      <p>Use <b>Edit balances</b> to replace the current four totals after a mistake or to resume tracking. The correction is logged and undoable but does not count as Mahjong winnings.</p>
      <div class="modal-controls"><button class="btn primary" data-action="close-modal" type="button">Done</button></div></div>`;
  }

  function normalizeDraft(model) {
    const d = ui.draft;
    if (!Number.isInteger(d.collector) || d.collector < 0 || d.collector > 3) d.collector = 0;
    if (!Number.isInteger(d.winner) || d.winner < 0 || d.winner > 3) d.winner = 0;
    if (!Number.isInteger(d.gangPlayer) || d.gangPlayer < 0 || d.gangPlayer > 3) d.gangPlayer = 0;
    if (d.discarder===d.winner || !Number.isInteger(d.discarder) || d.discarder<0 || d.discarder>3) d.discarder = [0,1,2,3].find(i=>i!==d.winner);
    if (d.gangPayer!==null && (!Number.isInteger(d.gangPayer) || d.gangPayer<0 || d.gangPayer>3 || d.gangPayer===d.gangPlayer)) d.gangPayer=null;
    if (typeof d.gangAmount!=='string') d.gangAmount='';
    if (!Number.isInteger(d.flower) || d.flower<1 || d.flower>4) d.flower = 1;
    if (!['pair','set'].includes(d.flowerMode)) d.flowerMode='pair';
    if (!Object.hasOwn(FLOWER_SET_NAMES,d.flowerSet)) d.flowerSet='flowers';
    if (!['self','shot','unpaid'].includes(d.gangMode)) d.gangMode='self';
    if (d.gangMode==='shot' && d.gangPayer===null) d.gangPayer=[0,1,2,3].find(i=>i!==d.gangPlayer);
    if (!Number.isInteger(d.tai) || d.tai<1 || d.tai>5) d.tai = 3;
    if (!['self','discard'].includes(d.method)) d.method='self';
  }

  function validateNames(inputs) {

  function downloadCSV() {
    const m=derive(session);
    const rows=[
      ['Mahjong Ledger | Singapore Mahjong'],
      ['Session started',session.createdAt||''],
      ['Tracking began at hand',m.startHand],
      [],
      ['Player','Balance when tracking began (AUD)','Current balance (AUD)','Recorded Mahjong net (AUD)','Current wind','Seat'],
      ...session.players.map((n,i)=>[n,(m.initialBalances[i]/100).toFixed(2),(m.balances[i]/100).toFixed(2),(m.earned[i]/100).toFixed(2),WINDS[windOfPlayer(m.east,i)],i+1]),
      ['TOTAL',(m.initialBalances.reduce((a,b)=>a+b,0)/100).toFixed(2),(m.total/100).toFixed(2)],
      [],
      ['Shot scoreboard'],
      ['Player','Gang shots','Gang paid (AUD)','Winning discards','Discard paid (AUD)','Total shots','Total shot payments (AUD)'],
      ...m.shotStats.map(e=>[name(e.player),e.gangShots,(e.gangPaid/100).toFixed(2),e.winningDiscards,(e.winPaid/100).toFixed(2),e.totalShots,(e.totalPaid/100).toFixed(2)]),
      [],
      ['Hand','East banker','Event','Payer','Receiver','Amount (AUD)','Notes']
    ];
    for(const hand of m.hands) {
      for(const event of hand.events) {
        if(event.type==='adjust') {
          event.changes.forEach((delta,i)=>{if(delta!==0) rows.push([hand.number,name(hand.east),'Balance correction','',name(i),(delta/100).toFixed(2),`Set balance to ${(event.next[i]/100).toFixed(2)}; excluded from shot/win statistics`]);});
          continue;
        }
        if(event.type==='gang' && !event.transfers.length) {
          rows.push([hand.number,name(hand.east),'Gang (declaration only)','','','0.00',`${name(event.player)} declared Gang; no payout or shooter counted`]);
        }
        for(const transfer of event.transfers) {
          const eventName=event.type==='gang'?(event.mode==='self'?'Self-claimed Gang':'Gang shot'):event.type==='flower'?'Flower pair':event.type==='flowerSet'?'Same-colour flower set':'Win';
          const detail=event.type==='gang'?event.mode==='self'?`${name(event.player)} claimed Gang; all opponents pay; no shot counted`:`${name(event.player)} claimed Gang; ${name(event.payer)} shot`:
            event.type==='flower'?`Pair #${event.flower}${event.initial?' / original dealt tiles x2':''}`:
            event.type==='flowerSet'?`${FLOWER_SET_NAMES[event.set]}; all opponents pay 0.40`:`${event.tai} Tai / ${event.method==='self'?'self-draw':'discard'}`;
          rows.push([hand.number,name(hand.east),eventName,name(transfer.from),name(transfer.to),(transfer.cents/100).toFixed(2),detail]);
        }
      }
      if(hand.outcome?.type==='draw') rows.push([hand.number,name(hand.east),'Draw','','','0.00',hand.outcome.nonEastGang?`Non-East Gang: banker advances to ${name(hand.outcome.nextEast)}`:'No non-East Gang: banker stays']);
    }
    const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='mahjong-ledger-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('CSV exported with shots and balances.');
  }
  function handleAction(action, button) {

      const resume=document.getElementById('setup-resume')?.checked || false;
      let initialBalances=[STARTING_CENTS,STARTING_CENTS,STARTING_CENTS,STARTING_CENTS];
      let startHand=1;

        initialBalances=[0,1,2,3].map(i=>parseMoneyInput(document.getElementById('resume-balance-'+i)?.value));
        startHand=Number(document.getElementById('setup-hand')?.value);
        if(initialBalances.some(v=>v===null)){showToast('Please enter valid balances with at most two decimal places.');return;}
        if(!Number.isInteger(startHand) || startHand<1 || startHand>9999){showToast('Hand number must be between 1 and 9999.');return;}
      }

      addAction({type:'flower',collector:d.collector,flower:d.flower,initial:d.initial},`${name(d.collector)} received ${money(credits)} for flowers.`);

      addAction({type:'gang',player:d.gangPlayer,mode,payer,cents},feedback);

      const names=validateNames([0,1,2,3].map(i=>'edit-name-'+i));
      if (!names) return;
      session.players=names; persist(); ui.modal=null; repaint(); showToast('Player names updated.'); return;
    }
    if (action==='reset-confirm') { ui.modal='reset'; repaint(); return; }
    if (action==='confirm-reset') {
      try {localStorage.removeItem(STORAGE_KEY);} catch(e){}
      session=null; ui.modal=null; ui.tab='flower'; ui.allHistory=false; repaint(); showToast('New session ready.'); return;
    }
  }
  root.addEventListener('click', function (event) {
    const target = event.target.closest('[data-action]');
    if (!target || target.disabled) return;
    handleAction(target.dataset.action,target);
  });
  document.addEventListener('click', function (event) {
    if (event.target.id === 'modal-backdrop') { ui.modal=null; repaint(); return; }
    const target=event.target.closest('#modal-container [data-action]');
    if (!target || target.disabled) return;
    handleAction(target.dataset.action,target);
  });
  root.addEventListener('change', function (event) {
    const t=event.target;
    if(t.id==='setup-resume'){
      const region=document.getElementById('resume-fields');
      if(region) region.hidden=!t.checked;
      return;
    }
    if (t.matches('input[name="setup-east"]')) {
      document.querySelectorAll('[data-setup-east-label]').forEach(label=>label.classList.toggle('active',label.dataset.setupEastLabel===t.value));
      return;
    }
    const field=t.dataset.field;
    if (!field || !session) return;
    if (field==='initial') ui.draft.initial=t.checked;
    else if(field==='gangPayer') ui.draft.gangPayer=t.value===''?null:Number(t.value);
    else if(field==='gangAmount') { ui.draft.gangAmount=t.value; return; }
    else ui.draft[field]=Number(t.value);
    if(field==='gangPlayer' && ui.draft.gangPayer===ui.draft.gangPlayer) ui.draft.gangPayer=[0,1,2,3].find(i=>i!==ui.draft.gangPlayer);
    repaint();
  });
  root.addEventListener('input', function (event) {
    if(event.target.dataset.field==='gangAmount') {
      ui.draft.gangAmount=event.target.value;
      const cents=parseMoneyInput(event.target.value);
      const amount=document.getElementById('gang-shot-amount');
      const description=document.getElementById('gang-shot-note');
      if(amount) amount.textContent=cents>0?'+'+money(cents):'$0.00';
      if(description) description.textContent=cents>0?`${name(ui.draft.gangPayer)} pays ${name(ui.draft.gangPlayer)} ${money(cents)}. This counts as one Gang shot.`:'Enter a positive payment amount to count a Gang shot.';
      return;
    }
    if(event.target.id?.startsWith('resume-balance-')) {
      const vals=[0,1,2,3].map(i=>parseMoneyInput(document.getElementById('resume-balance-'+i)?.value));
      const el=document.getElementById('resume-total');
      if(el) el.innerHTML=vals.some(v=>v===null)?'Please enter valid dollar amounts.':`Current table total: <b>${money(vals.reduce((a,b)=>a+b,0))}</b>`;
      return;
    }
    if (!event.target.id?.startsWith('setup-player-')) return;
    const i=Number(event.target.id.split('-').at(-1));
    const preview=document.querySelector(`[data-setup-name-preview="${i}"]`);
    if (preview) preview.textContent=event.target.value.trim() || `Seat ${i+1}`;
  });
  document.addEventListener('change', function (event) {
    if (event.target.id !== 'draw-extra-gang' || !session) return;
    const m = derive(session);
    const raw = event.target.value;
    const hasNonEastGang = m.current.gangs.some(p => p !== m.east) || (raw !== '' && Number(raw) !== m.east);
    const nextEast = hasNonEastGang ? (m.east+1)%4 : m.east;
    const node = document.getElementById('draw-east-prediction');
    if (node) node.textContent = hasNonEastGang ?
      `Non-East Gang: East passes from ${name(m.east)} to ${name(nextEast)} on the next hand.` :
      `No non-East Gang: ${name(m.east)} stays East on the next hand.`;
  });
  document.addEventListener('keydown', function (event) {
    if (event.key==='Escape' && ui.modal) {ui.modal=null; repaint();}
  });
  // Exposes deterministic, pure calculations for optional automated verification.
  window.MahjongLedgerLogic={derive,flowerTransfers,flowerSetTransfers,selfGangTransfers,winningTransfers,shotStatistics,parseMoneyInput,BASE_CENTS,SELF_GANG_CENTS,FLOWER_SET_CENTS,STARTING_CENTS};
  repaint();
})();
</script>
</body>
</html>
